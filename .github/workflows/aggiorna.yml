name: Aggiornamento Meteo Quotidiano

on:
  schedule:
    - cron: '30 7 * * *' # Gira alle 07:30 UTC (08:30 ora solare / 09:30 ora legale)
  workflow_dispatch: # Permette anche di avviarlo a mano con un clic

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica archivio
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Esegui analisi meteo
        run: python meteo.py

      - name: Salva storico e pagina web
        run: |
          git config --global user.name "Meteo Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index.html storico_meteo.csv
          git commit -m "Aggiornamento meteo quotidiano" || exit 0
          git push
